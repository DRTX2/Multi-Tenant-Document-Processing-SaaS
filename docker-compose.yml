version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: aspnetproject-postgres
    environment:
      POSTGRES_DB: aspnetproject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "-E UTF8"
      TZ: America/New_York
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aspnetproject-network
    restart: unless-stopped

  # pgAdmin para administración de base de datos (opcional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aspnetproject-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aspnetproject.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - aspnetproject-network
    restart: unless-stopped

  # Aplicación ASP.NET (opcional, para desarrollo con Docker)
  # app:
  #   build:
  #     context: .
  #     dockerfile: AspNetProject/Dockerfile
  #   container_name: aspnetproject-app
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ConnectionStrings__DefaultConnection=Host=postgres;Database=aspnetproject;Username=postgres;Password=postgres;Port=5432
  #   ports:
  #     - "5000:8080"
  #     - "5001:8081"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - aspnetproject-network
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  aspnetproject-network:
    driver: bridge
